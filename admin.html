<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Editor — Nagham Kheir</title>
<style>
  :root {
    --ink: #21182a;
    --ink-soft: #726779;
    --bg: #f5f3f8;
    --card: #ffffff;
    --line: #e8e2ec;
    --rose: #8c4c83;
    --rose-deep: #64335f;
    --pink: #ee8dc6;
    --pink-soft: #fff0fa;
    --blush: #fbf4fc;
    --green: #059669;
    --red: #dc2626;
    --radius: 20px;
    --radius-sm: 12px;
    --shadow: 0 2px 8px rgba(41, 25, 49, 0.04), 0 14px 36px rgba(93, 50, 92, 0.07);
    --shadow-lg: 0 12px 34px rgba(36, 20, 45, 0.12), 0 28px 72px rgba(116, 55, 104, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }

  button { font-family: inherit; cursor: pointer; }
  input[type=text], textarea, input[type=password] { font-family: inherit; }

  /* ---------------- login ---------------- */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(800px 500px at 15% 110%, rgba(255, 148, 203, 0.35), transparent 60%),
      radial-gradient(800px 500px at 88% -8%, rgba(0, 196, 204, 0.18), transparent 60%),
      linear-gradient(155deg, #6b3a50, #8a4d63 55%, #a85e7a);
    padding: 20px;
  }
  .login-card {
    background: #fff; border-radius: 24px; padding: 44px 40px; width: 380px;
    box-shadow: var(--shadow-lg); text-align: center;
    animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
  .login-card .logo { font-size: 20px; font-weight: 800; letter-spacing: 0.06em; color: var(--rose); text-transform: uppercase; }
  .login-card .logo span { color: var(--pink); }
  .login-card h1 { font-size: 22px; margin: 16px 0 6px; font-weight: 700; color: var(--ink); }
  .login-card p { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 24px; line-height: 1.5; }
  .login-card input {
    width: 100%; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-size: 14px; margin-bottom: 12px; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease;
    background: #fafafa;
  }
  .login-card input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255, 148, 203, 0.12); background: #fff; }
  .login-card button {
    width: 100%; padding: 13px; border: 0; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--pink), var(--rose)); color: #fff;
    font-weight: 700; font-size: 14px; letter-spacing: 0.02em; margin-top: 4px;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .login-card button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(159, 89, 112, 0.35); }
  .login-card button:active { transform: translateY(0); }
  .login-err { color: var(--red); font-size: 13px; margin-top: 12px; display: none; background: #fef2f2; padding: 10px 14px; border-radius: var(--radius-sm); text-align: left; }

  /* ---------------- layout ---------------- */
  .app { display: flex; min-height: 100vh; }

  aside {
    width: 252px; flex: 0 0 252px;
    background: linear-gradient(165deg, #2e1a39, #201427 58%, #341b3c);
    color: #fff; display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  aside .brand { padding: 30px 24px 24px; font-size: 17px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; }
  aside .brand span { color: var(--pink); }
  aside .brand small { display: block; font-size: 10.5px; font-weight: 500; letter-spacing: 0.14em; color: rgba(255,255,255,0.35); text-transform: uppercase; margin-top: 4px; }
  aside nav { flex: 1; overflow-y: auto; padding: 4px 12px; }
  aside nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: 0; color: rgba(255,255,255,0.6);
    font-size: 13px; font-weight: 600; padding: 11px 14px; border-radius: 11px; cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
  }
  aside nav button::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); flex: 0 0 auto; transition: background 0.15s ease; }
  aside nav button:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.95); transform: translateX(2px); }
  aside nav button.active { background: linear-gradient(90deg, rgba(238,141,198,0.28), rgba(238,141,198,0.1)); color: #fff; font-weight: 700; }
  aside nav button.active::before { background: var(--pink); box-shadow: 0 0 0 3px rgba(255,148,203,0.2); }
  aside .side-actions { padding: 14px 12px 18px; border-top: 1px solid rgba(255,255,255,0.07); display: grid; gap: 8px; }
  aside .side-actions a, aside .side-actions button {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; font-weight: 600; padding: 10px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.75);
    background: transparent; text-decoration: none; transition: background 0.15s ease;
  }
  aside .side-actions a:hover, aside .side-actions button:hover { background: rgba(255,255,255,0.07); }
  aside .side-actions .primary { background: rgba(255,148,203,0.18); border-color: rgba(255,148,203,0.3); color: var(--pink); font-weight: 700; }
  aside .side-actions .primary:hover { background: rgba(255,148,203,0.26); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px;
    min-height: 80px; padding: 16px 40px;
    background: rgba(245,243,248,0.84); backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .crumbs { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
  .topbar h2 { font-size: 22px; font-weight: 750; letter-spacing: -0.03em; }
  .topbar .spacer { flex: 1; }
  .dirty-chip {
    font-size: 12px; font-weight: 600; color: var(--rose);
    background: var(--pink-soft); padding: 6px 14px; border-radius: 999px;
    opacity: 0; transition: opacity 0.2s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  .dirty-chip.show { opacity: 1; }
  .dirty-chip::before { content: "●"; font-size: 8px; }
  .btn-save {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color: #fff; border: 0; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 700; padding: 12px 20px;
    box-shadow: 0 4px 14px rgba(159, 89, 112, 0.3);
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }
  .btn-save:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(159, 89, 112, 0.4); }
  .btn-save:disabled { opacity: 0.55; cursor: default; transform: none; }
  .btn-save.ok { background: linear-gradient(135deg, var(--green), #047857); box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3); }
  .kbd { font-size: 10.5px; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; padding: 2px 7px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: #fff; color: var(--ink-soft); font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: var(--blush); color: var(--rose); }

  .content { padding: 42px 40px 56px; max-width: 1040px; width: 100%; }

  .section-desc { font-size: 14px; color: var(--ink-soft); margin: -8px 0 28px; line-height: 1.55; }

  .card {
    background: var(--card); border: 1px solid rgba(232, 226, 236, 0.9); border-radius: var(--radius); padding: 30px;
    margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .card h3 {
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--rose); margin-bottom: 22px; display: flex; align-items: center; gap: 10px;
  }
  .card h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; letter-spacing: 0.01em; }
  .field input[type=text], .field textarea {
    width: 100%; padding: 12px 14px; font-size: 14px;
    border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: #fcfbfd;
    outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .field input[type=text]:focus, .field textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,148,203,0.1); background: #fff; }
  .field textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
  .hint { font-size: 11.5px; color: #9ca3af; margin-top: 5px; }

  .file-row { display: flex; align-items: center; gap: 12px; }
  .file-row input[type=text] { flex: 1; }
  .file-row .preview {
    width: 54px; height: 54px; border-radius: var(--radius-sm); object-fit: cover;
    background: var(--blush); flex: 0 0 auto; border: 1px solid var(--line);
    visibility: hidden;
  }
  .file-row .preview.show { visibility: visible; }
  .upload-wrap { position: relative; flex: 0 0 auto; }
  .upload-wrap .bar {
    position: absolute; left: 6px; right: 6px; bottom: -4px; height: 3px; border-radius: 2px;
    background: var(--pink); transform: scaleX(0); transform-origin: 0 50%;
    transition: transform 0.2s ease;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { border-color: var(--pink); background: var(--pink-soft); }
  .btn.small { padding: 7px 12px; font-size: 11.5px; }
  .btn.ghost-danger { color: var(--red); border-color: var(--line); background: transparent; }
  .btn.ghost-danger:hover { border-color: var(--red); background: #fef2f2; }

  .list-editor { border: 1.5px dashed #dcd0e1; border-radius: 16px; padding: 20px; margin-bottom: 16px; background: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(255,240,250,0.5)); }
  .list-editor > h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 14px; }
  .list-item { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 12px; box-shadow: 0 5px 14px rgba(60, 29, 70, 0.035); }
  .list-item:last-child { margin-bottom: 0; }
  .item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .item-head .item-title { font-size: 13px; font-weight: 700; color: var(--rose); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-head .move { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink-soft); font-size: 13px; line-height: 1; transition: border-color 0.15s ease, color 0.15s ease; }
  .item-head .move:hover:not(:disabled) { border-color: var(--pink); color: var(--rose); }
  .item-head .move:disabled { opacity: 0.25; cursor: default; }
  .item-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .item-fields .full { grid-column: 1 / -1; }
  .add { margin-top: 14px; border-style: dashed; color: var(--rose); }
  .add:hover { border-color: var(--rose); background: var(--pink-soft); }

  .toast {
    position: fixed; bottom: 28px; right: 28px; z-index: 100;
    background: var(--ink); color: #fff; padding: 14px 24px; border-radius: 14px;
    font-size: 13.5px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    opacity: 0; transform: translateY(10px); transition: all 0.25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { background: var(--green); }
  .toast.err { background: var(--red); }
  .toast::before { content: "✓"; font-weight: 800; font-size: 15px; }
  .toast.err::before { content: "!"; }
  .toast.info::before { content: ""; }

  .nested { margin-left: 14px; padding-left: 14px; border-left: 2px solid var(--pink-soft); margin-top: 12px; }

  @media (max-width: 900px) {
    .app { flex-direction: column; }
    aside { width: 100%; flex: none; height: auto; position: static; }
    aside nav { display: flex; flex-wrap: wrap; padding: 8px; }
    aside nav button { width: auto; flex: 1 1 30%; justify-content: center; text-align: center; padding: 8px 6px; font-size: 12px; }
    aside nav button::before { display: none; }
    aside .side-actions { flex-direction: row; }
    .topbar { min-height: auto; padding: 14px 16px; flex-wrap: wrap; }
    .content { padding: 16px; }
    .item-fields { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .dirty-chip, .kbd { display: none; }
  }
</style>
</head>
<body>

<div id="loginView" class="login-wrap" style="display:none">
  <div class="login-card">
    <div class="logo">nagham<span>kheir</span></div>
    <h1>Site editor</h1>
    <p>Connect with your GitHub account to edit the website.</p>
    <input type="password" id="ghToken" placeholder="GitHub Personal Access Token" autocomplete="off" />
    <input type="text" id="ghOwner" placeholder="GitHub username or org" autocomplete="off" />
    <input type="text" id="ghRepo" placeholder="Repository name" autocomplete="off" />
    <button id="loginBtn">Connect &amp; Edit</button>
    <div class="login-err" id="loginErr">Connection failed. Check your credentials and try again.</div>
    <p style="margin-top:14px;font-size:11.5px;color:var(--ink-soft);line-height:1.5">You need a <a href="https://github.com/settings/tokens" target="_blank" style="color:var(--rose)">GitHub Personal Access Token</a> with <strong>repo</strong> scope.</p>
  </div>
</div>

<div id="appView" class="app" style="display:none">
  <aside>
    <div class="brand">nagham<span>kheir</span><small>content editor</small></div>
    <nav id="sectionNav"></nav>
    <div class="side-actions">
      <a class="primary" href="/" target="_blank" id="viewSite">↗ View site</a>
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="crumbs">Editing</div>
        <h2 id="sectionTitle"></h2>
      </div>
      <div class="spacer"></div>
      <span class="dirty-chip" id="dirtyChip">Unsaved changes</span>
      <button class="btn-save" id="saveBtn">💾 Save <span class="kbd">Ctrl+S</span></button>
    </header>
    <div class="content">
      <p class="section-desc" id="sectionDesc"></p>
      <div id="sectionBody"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------------- schema: what can be edited ---------------- */

const SCHEMA = [
  { id: "site", label: "Site", desc: "Page title, meta description and brand text.", fields: [
    { p: ["site", "title"], label: "Page title (browser tab)" },
    { p: ["site", "description"], label: "Meta description (search engines)", area: true },
    { p: ["site", "brand"], label: "Brand word 1" },
    { p: ["site", "brandAccent"], label: "Brand word 2 (pink)" },
  ]},
  { id: "nav", label: "Navigation", desc: "The menu at the top of the page.", fields: [
    { p: ["nav", "cta"], label: "CTA button text" },
  ], lists: [
    { p: ["nav", "links"], label: "Menu links", itemFields: [
      { p: ["label"], label: "Label" },
      { p: ["href"], label: "Link (e.g. #about)" },
    ]},
  ]},
  { id: "hero", label: "Hero", desc: "The big welcome section at the top.", fields: [
    { p: ["hero", "chip"], label: "Badge text" },
    { p: ["hero", "headline1"], label: "Headline — line 1" },
    { p: ["hero", "headline2"], label: "Headline — line 2 (outline)" },
    { p: ["hero", "sub"], label: "Subtitle (HTML allowed, e.g. <strong>)", area: true },
    { p: ["hero", "ctaLabel"], label: "Primary button text" },
    { p: ["hero", "photo"], label: "Portrait photo", file: "image" },
    { p: ["hero", "photoAlt"], label: "Photo alt text" },
    { p: ["hero", "mailDisplay"], label: "Email text under the photo" },
  ]},
  { id: "cv", label: "CV / Resume", desc: "The downloadable CV file and its button text.", fields: [
    { p: ["cv", "file"], label: "CV file (PDF)", file: "file" },
    { p: ["cv", "label"], label: "Button text" },
  ]},
  { id: "ticker", label: "Ticker", desc: "The scrolling words under the hero.", lists: [
    { p: ["ticker"], label: "Scrolling words", list: "scalar" },
  ]},
  { id: "about", label: "About", desc: "Your bio section.", fields: [
    { p: ["about", "big"], label: "Big pink word" },
    { p: ["about", "outline"], label: "Outline word" },
    { p: ["about", "photo"], label: "Photo", file: "image" },
    { p: ["about", "label"], label: "Heading" },
  ], lists: [
    { p: ["about", "paragraphs"], label: "Paragraphs (HTML allowed)", list: "scalar", area: true },
    { p: ["about", "badges"], label: "Badges", itemFields: [
      { p: ["num"], label: "Number / icon (e.g. A→Z)" },
      { p: ["label"], label: "Text" },
    ]},
  ]},
  { id: "niche", label: "Content Style", desc: "The niche photos with captions.", fields: [
    { p: ["niche", "label"], label: "Heading" },
    { p: ["niche", "desc"], label: "Description (HTML allowed)", area: true },
  ], lists: [
    { p: ["niche", "photos"], label: "Photos with captions", itemFields: [
      { p: ["src"], label: "Photo", file: "image" },
      { p: ["caption"], label: "Caption (UGC / Storytelling…)" },
    ]},
  ]},
  { id: "services", label: "Services", desc: "The three service cards.", fields: [
    { p: ["services", "title"], label: "Section title" },
    { p: ["services", "em"], label: "Title accent word (outline)" },
  ], lists: [
    { p: ["services", "items"], label: "Service cards", itemFields: [
      { p: ["num"], label: "Number (01, 02…)" },
      { p: ["title"], label: "Title" },
      { p: ["desc"], label: "Description", area: true },
    ]},
  ]},
  { id: "work", label: "Work Videos", desc: "The tabbed video gallery. Each category holds its own videos.", fields: [
    { p: ["work", "title"], label: "Section title" },
    { p: ["work", "em"], label: "Title accent word (outline)" },
  ], lists: [
    { p: ["work", "tabs"], label: "Categories", itemFields: [
      { p: ["id"], label: "Short id (content, ugc, reviews, story)" },
      { p: ["label"], label: "Tab label" },
    ], nestedList: {
      p: ["videos"], label: "Videos in this category", itemFields: [
        { p: ["src"], label: "Video file", file: "video" },
        { p: ["poster"], label: "Poster image (shown before play)", file: "image" },
      ],
    }},
  ]},
  { id: "photography", label: "Photography", desc: "The photo grid.", fields: [
    { p: ["photography", "title"], label: "Section title" },
    { p: ["photography", "em"], label: "Title accent word (outline)" },
  ], lists: [
    { p: ["photography", "photos"], label: "Photos", list: "scalar", file: "image" },
  ]},
  { id: "testimonials", label: "Testimonials", desc: "Add client testimonials — each with name, written quote, photo, and optional voice or video attachment.", fields: [
    { p: ["testimonials", "title"], label: "Section title" },
    { p: ["testimonials", "em"], label: "Title accent word (outline)" },
  ], lists: [
    { p: ["testimonials", "items"], label: "Testimonials", itemFields: [
      { p: ["name"], label: "Client name" },
      { p: ["avatar"], label: "Client photo", file: "image" },
      { p: ["quote"], label: "Written testimonial (HTML allowed)", area: true },
      { p: ["audio"], label: "Voice / audio attachment", file: "audio" },
      { p: ["video", "src"], label: "Video attachment", file: "video" },
      { p: ["video", "poster"], label: "Video poster image", file: "image" },
      { p: ["stars"], label: "Stars" },
      { p: ["badge"], label: "Badge line" },
    ]},
  ]},
  { id: "contact", label: "Contact", desc: "The closing section and your contact links.", fields: [
    { p: ["contact", "line1"], label: "Big line 1" },
    { p: ["contact", "line2"], label: "Big line 2" },
    { p: ["contact", "thanks"], label: "Thank-you text (HTML allowed)", area: true },
    { p: ["contact", "email"], label: "Email" },
    { p: ["contact", "whatsapp"], label: "WhatsApp link (wa.me/…)" },
    { p: ["contact", "instagram"], label: "Instagram link" },
    { p: ["contact", "instagramDisplay"], label: "Instagram text shown on buttons" },
  ]},
  { id: "results", label: "Results", desc: "Video results and view-count screenshots. Upload screenshots to the stats folder.", fields: [
    { p: ["results", "title"], label: "Section title" },
    { p: ["results", "em"], label: "Title accent word (outline)" },
  ], lists: [
    { p: ["results", "items"], label: "Result cards", itemFields: [
      { p: ["title"], label: "Title (e.g. Video title or brand name)" },
      { p: ["screenshot"], label: "Screenshot of views / stats", file: "image" },
      { p: ["label"], label: "Stats label (e.g. 1.2M views)" },
    ]},
  ]},
  { id: "footer", label: "Footer", desc: "The small line at the very bottom.", fields: [
    { p: ["footer", "name"], label: "Name" },
    { p: ["footer", "tagline"], label: "Tagline" },
  ]},
];

/* ---------------- helpers ---------------- */

const $ = (sel) => document.querySelector(sel);

function get(obj, pathArr) {
  let cur = obj;
  for (const k of pathArr) {
    if (cur == null) return undefined;
    cur = cur[k];
  }
  return cur;
}
function set(obj, pathArr, val) {
  let cur = obj;
  for (let i = 0; i < pathArr.length - 1; i++) {
    if (cur[pathArr[i]] == null) cur[pathArr[i]] = {};
    cur = cur[pathArr[i]];
  }
  cur[pathArr[pathArr.length - 1]] = val;
  markDirty();
}

/* ---------------- client-side template engine (for GitHub-mode export) ---------------- */

function tplEsc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function tplTokenize(tpl) {
  const re = /{{([^}]+)}}/g;
  const stack = [{ type: "root", children: [] }];
  let last = 0, m;
  while ((m = re.exec(tpl))) {
    if (m.index > last) stack[stack.length - 1].children.push({ type: "text", text: tpl.slice(last, m.index) });
    const tok = m[1].trim();
    if (tok.startsWith("/")) {
      const name = tok.slice(1).trim();
      const top = stack[stack.length - 1];
      const isIfClose = top.type === "block" && top.name.startsWith("if ") && name === "if";
      if (top.type === "block" && (top.name === name || isIfClose)) stack.pop();
      else throw new Error("Mismatched template close: " + name);
    } else if (tok.startsWith("#") || tok.startsWith("^")) {
      const node = { type: "block", kind: tok[0], name: tok.slice(1).trim(), children: [] };
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    } else {
      stack[stack.length - 1].children.push({ type: "token", value: tok });
    }
    last = m.index + m[0].length;
  }
  if (last < tpl.length) stack[stack.length - 1].children.push({ type: "text", text: tpl.slice(last) });
  return stack[0].children;
}

function tplResolve(pathStr, ctxStack) {
  if (pathStr === "." || pathStr === "this") return ctxStack[ctxStack.length - 1];
  const parts = pathStr.split(".").map((p) => p.trim());
  for (let i = ctxStack.length - 1; i >= 0; i--) {
    let cur = ctxStack[i], ok = true;
    for (const p of parts) {
      if (cur == null || !(p in Object(cur))) { ok = false; break; }
      cur = cur[p];
    }
    if (ok) return cur;
  }
  return undefined;
}

function tplEvalNodes(nodes, ctxStack, out) {
  for (const n of nodes) {
    if (n.type === "text") { out.push(n.text); }
    else if (n.type === "token") {
      const [pathStr, flag] = n.value.split("|").map((s) => s.trim());
      let v = tplResolve(pathStr, ctxStack);
      if (v == null) v = "";
      out.push(flag === "raw" ? String(v) : tplEsc(v));
    } else if (n.type === "block") {
      if (n.kind === "#") {
        if (n.name.startsWith("if ")) {
          const cond = tplResolve(n.name.slice(3).trim(), ctxStack);
          if (cond) tplEvalNodes(n.children, ctxStack, out);
          continue;
        }
        const v = tplResolve(n.name, ctxStack);
        if (Array.isArray(v)) {
          v.forEach((item, idx) => tplEvalNodes(n.children, ctxStack.concat([{ __index: idx, __first: idx === 0 }, item]), out));
        } else if (v) { tplEvalNodes(n.children, ctxStack.concat([v]), out); }
      } else if (n.kind === "^") {
        const v = tplResolve(n.name, ctxStack);
        const empty = v == null || v === "" || (Array.isArray(v) && v.length === 0);
        if (empty) tplEvalNodes(n.children, ctxStack, out);
      }
    }
  }
}

function tplRender(templateText, data) {
  const nodes = tplTokenize(templateText);
  const out = [];
  tplEvalNodes(nodes, [data], out);
  return out.join("");
}

/* ---------------- GitHub API config ---------------- */

const gh = {
  token: localStorage.getItem("gh_token") || "",
  owner: localStorage.getItem("gh_owner") || "",
  repo: localStorage.getItem("gh_repo") || "",
  branch: localStorage.getItem("gh_branch") || "main",
  contentSha: null, // SHA of content.json (needed for updates)
};

function ghHeaders() {
  return {
    "Authorization": "Bearer " + gh.token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
  };
}

const CONTENT_FILE = "content.json";

/* Read a file from the repo → returns { content, sha } */
async function ghRead(filePath) {
  const url = `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${filePath}?ref=${gh.branch}`;
  const res = await fetch(url, { headers: ghHeaders() });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub read failed (${res.status})`);
  }
  const data = await res.json();
  const text = decodeURIComponent(escape(atob(data.content)));
  return { content: text, sha: data.sha };
}

/* Write / update a file in the repo */
async function ghWrite(filePath, text, sha, message) {
  const url = `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${filePath}`;
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(text))),
    branch: gh.branch,
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method: "PUT",
    headers: { ...ghHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub write failed (${res.status})`);
  }
  return res.json();
}

/* Upload a binary file (image / video / audio) to the repo */
async function ghUploadFile(file, destPath) {
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let binary = "";
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  const b64 = btoa(binary);

  /* Check if file already exists (to get its SHA for update) */
  let existingSha = null;
  try {
    const check = await ghRead(destPath);
    existingSha = check.sha;
  } catch (_) { /* new file */ }

  const url = `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${destPath}`;
  const body = {
    message: `Upload ${file.name}`,
    content: b64,
    branch: gh.branch,
  };
  if (existingSha) body.sha = existingSha;
  const res = await fetch(url, {
    method: "PUT",
    headers: { ...ghHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub upload failed (${res.status})`);
  }
  return destPath;
}

/* Validate the token by calling /user */
async function ghValidate() {
  const res = await fetch("https://api.github.com/user", { headers: ghHeaders() });
  if (!res.ok) throw new Error("Invalid token");
  return res.json();
}

/* ---------------- api (unified) ---------------- */

async function api(path, opts) {
  if (gh.token) {
    /* GitHub API mode */
    if (path === "/api/content" && (!opts || opts.method === "GET")) {
      const { content: text, sha } = await ghRead(CONTENT_FILE);
      gh.contentSha = sha;
      return JSON.parse(text);
    }
    if (path === "/api/content" && opts && opts.method === "PUT") {
      const body = JSON.parse(opts.body);
      const text = JSON.stringify(body, null, 2) + "\n";
      const res = await ghWrite(CONTENT_FILE, text, gh.contentSha, "Update site content");
      gh.contentSha = res.content && res.content.sha ? res.content.sha : gh.contentSha;
      return { ok: true };
    }
    throw new Error("Unknown API path in GitHub mode: " + path);
  }
  /* Local server mode */
  const res = await fetch(path, opts);
  if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

/* ---------------- file upload (XHR with progress) ---------------- */

function uploadFile(file, onProgress, optimized) {
  if (gh.token) {
    /* GitHub API mode — binary upload to repo */
    const name = file.name.replace(/[^A-Za-z0-9._-]/g, "_");
    const ext = name.split(".").pop().toLowerCase();
    let folder = null;
    if (["jpg","jpeg","png","gif","webp","svg","avif"].includes(ext)) folder = "assets/img";
    else if (["mp4","webm","mov"].includes(ext)) folder = "assets/video";
    else if (["ogg","mp3","wav","m4a","aac"].includes(ext)) folder = "assets/audio";
    else if (["pdf"].includes(ext)) folder = "assets/docs";
    if (!folder) return Promise.reject(new Error("Unsupported file type"));
    if (onProgress) onProgress(0.5);
    return ghUploadFile(file, folder + "/" + name).then((p) => {
      if (onProgress) onProgress(1);
      return p;
    });
  }
  /* Local server mode */
  return new Promise((resolve, reject) => {
    const name = file.name.replace(/[^A-Za-z0-9._-]/g, "_");
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", "/api/upload/" + encodeURIComponent(name));
    if (optimized) xhr.setRequestHeader("x-optimized", "1");
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText).path); }
        catch (_) { reject(new Error("Bad response")); }
      } else {
        let msg = "Upload failed";
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
        reject(new Error(msg));
      }
    };
    xhr.onerror = () => reject(new Error("Upload failed"));
    xhr.send(file);
  });
}

/* ---------------- upload optimization (compresses before it reaches the site) ---------------- */

const MAX_IMG_DIM = 2000; // longest side of an uploaded photo
const IMG_QUALITY = 0.82;
const MAX_VIDEO_DIM = 1920; // longest side, ~1080p
const VIDEO_BITRATE = 2500000; // ~2.5 Mbps — good quality, web-friendly size
const VIDEO_SKIP_BYTES = 5 * 1024 * 1024; // smaller clips are already efficient — leave them

function canOptimizeVideo() {
  return (
    typeof HTMLMediaElement !== "undefined" &&
    typeof HTMLMediaElement.prototype.captureStream === "function" &&
    typeof MediaRecorder !== "undefined" &&
    (MediaRecorder.isTypeSupported("video/webm;codecs=vp9") || MediaRecorder.isTypeSupported("video/webm;codecs=vp8"))
  );
}

async function optimizeImage(file) {
  // GIF/SVG keep their original format; tiny webp files are already optimized
  if (/\.gif$/i.test(file.name) || /\.svg$/i.test(file.name)) return file;
  if (/\.webp$/i.test(file.name) && file.size < 300 * 1024) return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("decode"));
      i.src = url;
    });
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) throw new Error("no dims");
    const scale = Math.min(1, MAX_IMG_DIM / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * scale));
    const ch = Math.max(1, Math.round(h * scale));
    const cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
    const blob = await new Promise((res) => cv.toBlob(res, "image/webp", IMG_QUALITY));
    URL.revokeObjectURL(url);
    if (!blob || blob.size === 0) throw new Error("encode");
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".webp", { type: "image/webp" });
  } catch (e) {
    return file; // couldn't process — upload the original
  }
}

function optimizeVideo(file, onProgress) {
  return new Promise((resolve) => {
    let raf = null, rec = null, v = null, timer = null;
    const bail = () => {
      if (raf) cancelAnimationFrame(raf);
      try { if (rec && rec.state !== "inactive") rec.stop(); } catch (_) {}
      try { if (v) { v.onended = v.onerror = v.ontimeupdate = null; v.pause(); v.removeAttribute("src"); v.load(); } } catch (_) {}
      if (timer) clearTimeout(timer);
      resolve(file);
    };
    if (!canOptimizeVideo() || file.size < VIDEO_SKIP_BYTES) return bail();
    const url = URL.createObjectURL(file);
    v = document.createElement("video");
    v.muted = true; // required for autoplay — the captured audio track is unaffected
    v.playsInline = true;
    v.preload = "auto";
    v.src = url;
    let started = false;
    const timeoutMs = Math.min(600000, (file.size / (1024 * 1024)) * 3000 + 30000);
    timer = setTimeout(bail, timeoutMs);
    v.onerror = () => { clearTimeout(timer); bail(); };
    v.onloadedmetadata = () => {
      if (started) return;
      started = true;
      const vw = v.videoWidth, vh = v.videoHeight;
      if (!vw || !vh) { clearTimeout(timer); URL.revokeObjectURL(url); return bail(); }
      // Smart skip: if the source is already efficiently compressed (≤ ~2.8 Mbps),
      // re-encoding would only make it bigger — keep the original.
      const dur = v.duration;
      if (dur && isFinite(dur) && dur > 0 && (file.size * 8) / (dur * 1000) <= 2800) {
        clearTimeout(timer); URL.revokeObjectURL(url); return bail();
      }
      const scale = Math.min(1, MAX_VIDEO_DIM / Math.max(vw, vh));
      const cw = Math.max(2, Math.round(vw * scale));
      const ch = Math.max(2, Math.round(vh * scale));
      const cv = document.createElement("canvas");
      cv.width = cw; cv.height = ch;
      const ctx = cv.getContext("2d");
      let stream;
      try {
        stream = cv.captureStream(30);
        const srcStream = v.captureStream();
        (srcStream.getAudioTracks() || []).forEach((t) => stream.addTrack(t));
      } catch (e) { clearTimeout(timer); URL.revokeObjectURL(url); return bail(); }
      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9"
        : "video/webm;codecs=vp8";
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: VIDEO_BITRATE, audioBitsPerSecond: 128000 });
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      const done = new Promise((res) => { rec.onstop = () => res(new Blob(chunks, { type: mime })); });
      const draw = () => { ctx.drawImage(v, 0, 0, cw, ch); raf = requestAnimationFrame(draw); };
      v.ontimeupdate = () => {
        if (v.duration && isFinite(v.duration) && onProgress) onProgress(Math.min(0.99, v.currentTime / v.duration));
      };
      const finish = async () => {
        try {
          await new Promise((r) => setTimeout(r, 500)); // let the last frames flush
          cancelAnimationFrame(raf);
          rec.stop();
          const blob = await done;
          clearTimeout(timer);
          URL.revokeObjectURL(url);
          if (!blob || blob.size === 0) return bail();
          resolve(new File([blob], file.name.replace(/\.[^.]+$/, "") + ".webm", { type: mime }));
        } catch (e) { clearTimeout(timer); URL.revokeObjectURL(url); bail(); }
      };
      v.onended = finish;
      v.play().then(() => {
        rec.start(250);
        raf = requestAnimationFrame(draw);
      }).catch(() => { clearTimeout(timer); URL.revokeObjectURL(url); bail(); });
    };
  });
}

async function uploadFileOptimized(file, kind, onProgress, onStage) {
  let outFile = file;
  let optimized = false;
  if (kind === "image") {
    if (onStage) onStage("Optimizing…");
    outFile = await optimizeImage(file);
    optimized = outFile !== file;
  } else if (kind === "video") {
    if (onStage) onStage("Optimizing (≈ video length)…");
    outFile = await optimizeVideo(file, (p) => onProgress && onProgress(p * 0.85));
    optimized = outFile !== file;
  }
  // kind === "file" (PDF, etc.) is uploaded as-is — never re-encoded
  if (onStage) onStage("Uploading…");
  const path = await uploadFile(outFile, (p) => onProgress && onProgress(0.85 + p * 0.15), optimized);
  return path;
}

/* ---------------- field renderers ---------------- */

function makeUploader(pathArr, kind) {
  const wrap = document.createElement("div");
  wrap.className = "file-row";
  const input = document.createElement("input");
  input.type = "text";
  input.value = get(content, pathArr) || "";
  input.addEventListener("input", () => set(content, pathArr, input.value));
  const preview =
    kind === "image" ? document.createElement("img")
    : kind === "video" ? document.createElement("video")
    : document.createElement("a"); // kind === "file" -> link to the uploaded file
  preview.className = "preview";
  if (kind === "video") { preview.muted = true; preview.playsInline = true; }
  if (kind === "file") { preview.target = "_blank"; preview.rel = "noopener"; preview.textContent = "View file ↗"; }
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "btn small";
  btn.textContent = "Upload";
  const file = document.createElement("input");
  file.type = "file";
  file.accept = kind === "image" ? "image/*" : kind === "video" ? "video/mp4,video/webm,video/quicktime" : kind === "audio" ? "audio/*" : ".pdf,application/pdf";
  file.style.display = "none";
  const progress = document.createElement("span");
  progress.className = "bar";
  btn.addEventListener("click", () => file.click());
  const origBtnText = btn.textContent;
  file.addEventListener("change", async () => {
    const f = file.files[0];
    if (!f) return;
    progress.style.transform = "scaleX(0)";
    btn.textContent = "Working…";
    btn.disabled = true;
    try {
      const p = await uploadFileOptimized(
        f,
        kind,
        (frac) => (progress.style.transform = "scaleX(" + frac + ")"),
        (msg) => (btn.textContent = msg)
      );
      input.value = p;
      set(content, pathArr, p);
      refreshPreview(preview, p);
      progress.style.transform = "scaleX(1)";
      setTimeout(() => (progress.style.transform = "scaleX(0)"), 900);
      toast("Uploaded ✓" + (kind === "file" ? "" : " (compressed)"), "ok");
    } catch (e) {
      progress.style.transform = "scaleX(0)";
      toast("Upload failed: " + e.message, "err");
    } finally {
      btn.textContent = origBtnText;
      btn.disabled = false;
      file.value = "";
    }
  });
  const upWrap = document.createElement("div");
  upWrap.className = "upload-wrap";
  upWrap.append(btn, progress);
  wrap.append(input, preview, upWrap, file);
  refreshPreview(preview, input.value);
  return wrap;
}

function refreshPreview(el, src) {
  if (!src) { el.classList.remove("show"); return; }
  el.classList.add("show");
  if (el.tagName === "A") { el.href = src; return; }
  el.src = src;
}

function makeInputField(field, pathArr) {
  const div = document.createElement("div");
  div.className = "field";
  const label = document.createElement("label");
  label.textContent = field.label;
  div.appendChild(label);
  if (field.file) {
    div.appendChild(makeUploader(pathArr, field.file));
  } else if (field.area) {
    const ta = document.createElement("textarea");
    ta.value = get(content, pathArr) || "";
    ta.addEventListener("input", () => set(content, pathArr, ta.value));
    div.appendChild(ta);
  } else {
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = get(content, pathArr) || "";
    inp.addEventListener("input", () => set(content, pathArr, inp.value));
    div.appendChild(inp);
  }
  return div;
}

function makeListEditor(listDef) {

  const h = document.createElement("h4");
  h.textContent = listDef.label;

    down.addEventListener("click", () => { swap(idx, idx + 1); });
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "btn small ghost-danger"; rm.textContent = "Remove";
    rm.addEventListener("click", () => { items.splice(idx, 1); renderItems(); });
    head.append(title, up, down, rm);
    row.appendChild(head);

    const fields = document.createElement("div");
    fields.className = "item-fields";

    if (listDef.list === "scalar") {
      const p = document.createElement("div");
      p.className = "full";
      const input = document.createElement("input");
      input.type = "text";
      input.value = item || "";
      input.addEventListener("input", () => { items[idx] = input.value; markDirty(); });
      if (listDef.file === "image") {
        const preview = document.createElement("img");
        preview.className = "preview";
        preview.style.marginTop = "8px";
        refreshPreview(preview, input.value);
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "btn small"; btn.textContent = "Upload";
        const file = document.createElement("input");
        file.type = "file"; file.accept = "image/*"; file.style.display = "none";
        btn.addEventListener("click", () => file.click());
        const progress = document.createElement("span");
        progress.className = "bar";
        const origBtnText = btn.textContent;
        file.addEventListener("change", async () => {
          const f = file.files[0]; if (!f) return;
          progress.style.transform = "scaleX(0)";
          btn.textContent = "Working…";
          btn.disabled = true;
          try {
            const path = await uploadFileOptimized(
              f,
              "image",
              (frac) => (progress.style.transform = "scaleX(" + frac + ")"),
              (msg) => (btn.textContent = msg)
            );
            input.value = path; items[idx] = path; refreshPreview(preview, path);
            markDirty();
            progress.style.transform = "scaleX(1)";
            setTimeout(() => (progress.style.transform = "scaleX(0)"), 900);
            toast("Uploaded ✓ (compressed)", "ok");
          } catch (e) { toast("Upload failed: " + e.message, "err"); }
          finally {
            btn.textContent = origBtnText;
            btn.disabled = false;
            file.value = "";
          }
        });
        const rowf = document.createElement("div");
        rowf.className = "file-row";
        const upWrap = document.createElement("div");
        upWrap.className = "upload-wrap";
        upWrap.append(btn, progress);
        rowf.append(input, preview, upWrap, file);
        p.appendChild(rowf);
      } else {
        p.appendChild(input);
      }
      fields.appendChild(p);
    } else {
      const itemFields = listDef.itemFields || [];
      const isNested = !!listDef.nestedList;
      itemFields.forEach((f) => {
        const wrapF = document.createElement("div");
        if (f.area) wrapF.className = "full";
        const label = document.createElement("label");
        label.textContent = f.label;
        wrapF.appendChild(label);
        if (f.file) {
          wrapF.appendChild(makeUploader(listDef.p.concat([idx]).concat(f.p), f.file));
        } else if (f.area) {
          const ta = document.createElement("textarea");
          ta.value = get(item, f.p) || "";
          ta.addEventListener("input", () => set(item, f.p, ta.value));
          wrapF.appendChild(ta);
        } else {
          const inp = document.createElement("input");
          inp.type = "text";
          inp.value = get(item, f.p) || "";
          inp.addEventListener("input", () => set(item, f.p, inp.value));
          wrapF.appendChild(inp);
        }
        fields.appendChild(wrapF);
      });
      if (isNested) {
        const nest = document.createElement("div");
        nest.className = "full nested";
        nest.appendChild(makeListEditor({ ...listDef.nestedList, p: listDef.p.concat([idx]).concat(listDef.nestedList.p) }));
        fields.appendChild(nest);
      }
    }
    row.appendChild(fields);
    return row;
  };

  const swap = (a, b) => {
    if (b < 0 || b >= items.length) return;
    const tmp = items[a];
    items[a] = items[b];
    items[b] = tmp;
    markDirty();
    renderItems();
  };

  const add = document.createElement("button");
  add.type = "button";
  add.className = "btn small add";
  add.textContent = "+ Add " + (listDef.list === "scalar" ? "item" : "one");
  add.addEventListener("click", () => {
    const newItem = listDef.list === "scalar" ? "" : {};
    if (listDef.itemFields && listDef.nestedList) newItem[listDef.nestedList.p[0]] = [];
    items.push(newItem);
    markDirty();
    renderItems();
  });
  renderItems();
  wrap.appendChild(add);
  return wrap;
}

/* ---------------- render a section ---------------- */

function renderSection(section) {
  $("#sectionTitle").textContent = section.label;
  $("#sectionDesc").textContent = section.desc || "";
  const body = $("#sectionBody");
  body.innerHTML = "";
  if (section.fields && section.fields.length) {
    const card = document.createElement("div");
    card.className = "card";
    const h3 = document.createElement("h3");
    h3.textContent = section.label;
    card.appendChild(h3);
    section.fields.forEach((f) => card.appendChild(makeInputField(f, f.p)));
    body.appendChild(card);
  }
  (section.lists || []).forEach((l) => {
    const card = document.createElement("div");
    card.className = "card";
    const h3 = document.createElement("h3");
    h3.textContent = l.label;
    card.appendChild(h3);
    card.appendChild(makeListEditor(l));
    body.appendChild(card);
  });
}

/* ---------------- app state ---------------- */

function buildNav() {
  const nav = $("#sectionNav");
  nav.innerHTML = "";
  SCHEMA.forEach((s) => {
    const b = document.createElement("button");
    b.textContent = s.label;
    b.dataset.id = s.id;
    if (s.id === activeSection) b.className = "active";
    b.addEventListener("click", () => {
      activeSection = s.id;
      nav.querySelectorAll("button").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      renderSection(s);
    });
    nav.appendChild(b);
  });
}

function showLogin() {
  $("#loginView").style.display = "flex";
  $("#appView").style.display = "none";
}
function showEditor() {
  $("#loginView").style.display = "none";
  $("#appView").style.display = "flex";
}

/* (mode detection is handled inline in the startup IIFE below) */

async function init() {
  try {
    content = await api("/api/content");
    showEditor();
    buildNav();
    renderSection(SCHEMA.find((s) => s.id === activeSection));
    clearDirty();
  } catch (e) {
    showLogin();
  }
}

/* ---------------- events ---------------- */

$("#loginBtn").addEventListener("click", async () => {
  const token = $("#ghToken").value.trim();
  const owner = $("#ghOwner").value.trim();
  const repo = $("#ghRepo").value.trim();
  if (!token || !owner || !repo) {
    $("#loginErr").textContent = "Please fill in all fields.";
    $("#loginErr").style.display = "block";
    return;
  }
  /* Validate token */
  gh.token = token; gh.owner = owner; gh.repo = repo;
  try {
    await ghValidate();
  } catch (e) {
    gh.token = ""; gh.owner = ""; gh.repo = "";
    $("#loginErr").textContent = "Invalid token or cannot reach GitHub. Check your credentials.";
    $("#loginErr").style.display = "block";
    return;
  }
  /* Persist for next visit */
  localStorage.setItem("gh_token", token);
  localStorage.setItem("gh_owner", owner);
  localStorage.setItem("gh_repo", repo);
  $("#loginErr").style.display = "none";
  /* Update the view-site link */
  const viewLink = $("#viewSite");
  if (viewLink) viewLink.href = `https://${owner}.github.io/${repo}/`;
  await init();
});
$("#ghRepo").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#loginBtn").click(); });

$("#saveBtn").addEventListener("click", save);
async function save() {
  try {
    await api("/api/content", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(content),
    });
    /* In GitHub mode, also export the rendered index.html so the live site updates */
    if (gh.token) {
      try {
        toast("Exporting index.html…", "info");
        const { content: tplText, sha: tplSha } = await ghRead("index.template.html");
        const rendered = tplRender(tplText, content);
        let indexSha = null;
        try { const r = await ghRead("index.html"); indexSha = r.sha; } catch (_) {}
        await ghWrite("index.html", rendered, indexSha, "Auto-export index.html from content.json");
      } catch (e) {
        toast("Content saved but export failed: " + e.message, "err");
        clearDirty();
        return;
      }
    }
    clearDirty();
    toast("Saved — the site will update shortly", "ok");
  } catch (e) {
    toast("Save failed: " + e.message, "err");
  }
}

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    if (dirty) save();
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  localStorage.removeItem("gh_token");
  localStorage.removeItem("gh_owner");
  localStorage.removeItem("gh_repo");
  gh.token = ""; gh.owner = ""; gh.repo = "";
  showLogin();
});

/* Auto-fill saved GitHub credentials */
if (gh.token && gh.owner && gh.repo) {
  $("#ghToken").value = gh.token;
  $("#ghOwner").value = gh.owner;
  $("#ghRepo").value = gh.repo;
}

/* ---- mode detection & startup ---- */
(async function startup() {
  /* Detect whether a local server is running */
  let mode = "github";
  try {
    const r = await fetch("/api/content", { signal: AbortSignal.timeout(2000) });
    if (r.ok || r.status === 401) mode = "server";
  } catch (_) {}

  const card = $(".login-card");

  if (mode === "server") {
    /* ---- Server mode: password login ---- */
    card.querySelector("h1").textContent = "Site editor";
    card.querySelector("p").textContent = "Enter the admin password to edit the website.";
    /* Hide all GitHub-specific inputs */
    $("#ghToken").style.display = "none";
    $("#ghOwner").style.display = "none";
    $("#ghRepo").style.display = "none";
    /* Hide the hint about GitHub tokens */
    const hint = card.querySelector("p:last-of-type");
    if (hint && hint.textContent.includes("GitHub")) hint.style.display = "none";
    /* Create or show password field */
    let pwField = $("#pw");
    if (!pwField) {
      pwField = document.createElement("input");
      pwField.type = "password"; pwField.id = "pw";
      pwField.placeholder = "Password"; pwField.autocomplete = "current-password";
      $("#ghToken").parentNode.insertBefore(pwField, $("#ghToken"));
    }
    pwField.style.display = "";
    pwField.focus();
    /* Override login button for server password */
    $("#loginBtn").onclick = async () => {
      const pw = pwField.value.trim();
      if (!pw) {
        $("#loginErr").textContent = "Please enter the password.";
        $("#loginErr").style.display = "block";
        return;
      }
      try {
        await api("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pw }),
        });
        pwField.value = "";
        $("#loginErr").style.display = "none";
        await init();
      } catch (e) {
        $("#loginErr").textContent = "Wrong password. Try again.";
        $("#loginErr").style.display = "block";
      }
    };
    pwField.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#loginBtn").click(); });
    /* If the server session cookie is still valid, auto-login */
    try {
      await init();
    } catch (_) { /* show login form */ }
  } else {
    /* ---- GitHub Pages mode: token login ---- */
    const viewLink = $("#viewSite");
    if (viewLink && gh.owner && gh.repo) viewLink.href = `https://${gh.owner}.github.io/${gh.repo}/`;
    /* Focus the first empty field */
    if (!gh.token) $("#ghToken").focus();
    else if (!gh.owner) $("#ghOwner").focus();
    else if (!gh.repo) $("#ghRepo").focus();
    /* Auto-login if all credentials are stored */
    if (gh.token && gh.owner && gh.repo) {
      await init();
    } else {
      showLogin();
    }
  }
})();
</script>
